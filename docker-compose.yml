# 企业办公自动化 Agent - Docker Compose
# 用法：
#   docker compose build
#   docker compose run --rm agent index --reset   # 构建索引
#   docker compose run --rm agent ask "年假几天" --mock  # 问答
#   docker compose run --rm agent meeting --mock   # 会议纪要
#   docker compose run --rm agent report --mock    # 周报
services:
  agent:
    build: .
    container_name: office-agent
    volumes:
      # 持久化向量库（重建索引后不丢失）
      - ./data/chroma:/app/data/chroma
      # 持久化模型权重（避免每次启动重新下载）
      - ./models:/app/models
      # 文档目录（热更新）
      - ./data/raw_docs:/app/data/raw_docs
      # 配置（可本地修改）
      - ./config:/app/config
      # 环境变量文件
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
